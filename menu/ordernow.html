<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ordernow.css">
    <title>Document</title>
</head>
<body>
<div class="container">    
    <header>
        <div class="title">
            List Products
        </div>
        <div class="iconCart">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"/>
</svg>
            <span>0</span>
        </div>
    </header>

    <div class="listproduct">
        <div class="item">
            <img src="../asset/ordernow/OIP.webp" alt="" width="300px" height="350px">
            <h2>Product Name</h2>
            <div class="price">$100</div>
            <button class="addcart">
                Add To Cart
            </button>
        </div>
    </div>
</div> 

<div class="carttab">
    <h1>CART</h1>
    <div class="listcart">
        <div class="cartitem">
            <img src="./asset/OIP.webp" alt="">
            <div class="content">
                <div class="name">
                    Product Name
                </div>
                <div class="cartprice">
                    Rs.450
                </div>
            </div>
            <div class="quantity">
                <button>-</button>
                <span class="value">3</span>
                <button>+</button>
            </div>
        </div>
    </div>
    <div class="button">
        <div class="close">Close</div>
        <div class="cheakout"><a href="cheakout.html">CHEAKOUT</a></div>
    </div>
</div>

    


    <script src="ordernow.js"></script>
</body>
</html>
